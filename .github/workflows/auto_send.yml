name: Auto Bot Telegram Infografis

on:
  schedule:
    # Berjalan otomatis setiap 1 jam antara jam 06:00 - 18:00 WITA (02:00 - 10:00 UTC)
    - cron: '0 2-10 * * *'
  workflow_dispatch: # Supaya bisa dicoba / dites manual via tombol di GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Auto Bot Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python auto_bot.py

      - name: Save Log Date
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_sent.txt || exit 0
          git commit -m "Update last sent log [skip ci]" || exit 0
          git push
